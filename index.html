<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동작 인식 & 리듬 벌레 잡기 게임</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- TensorFlow & Teachable Machine Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            user-select: none;
            touch-action: manipulation;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* Pulse and glow animations */
        @keyframes targetPulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.08); opacity: 1; }
        }

        .target-glow {
            animation: targetPulse 1.5s infinite ease-in-out;
        }

        @keyframes easterEggShake {
            0%, 100% { transform: translate(0, 0) scale(1); }
            10% { transform: translate(-10px, -10px) scale(1.1); }
            30% { transform: translate(10px, 10px) scale(1.1); }
            50% { transform: translate(-10px, 10px) scale(1.1); }
            70% { transform: translate(10px, -10px) scale(1.1); }
            90% { transform: translate(-5px, 5px) scale(1.05); }
        }

        .jumpscare-anim {
            animation: easterEggShake 0.15s infinite;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-2 sm:p-4 overflow-x-hidden">

    <!-- Header & Title -->
    <div class="text-center mb-3 sm:mb-6">
        <h1 class="text-2xl sm:text-4xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-yellow-400 to-emerald-400 font-orbitron">
            🦟 RHYTHM BUG SMASHER 🪳
        </h1>
        <p class="text-xs sm:text-sm text-gray-400 mt-1">
            타겟 존에 벌레가 도달했을 때 <b>파리(🦟)=박수 [A]</b> / <b>바퀴벌레(🪳)=주먹 [S]</b> 버튼을 누르세요!
        </p>
    </div>

    <!-- Main Game Frame -->
    <div class="relative w-full max-w-[640px] aspect-[4/3] bg-gray-950 rounded-2xl border-4 border-gray-800 shadow-[0_0_50px_rgba(239,68,68,0.2)] overflow-hidden">
        
        <!-- Canvas Layer -->
        <canvas id="gameCanvas" class="w-full h-full block bg-gradient-to-b from-gray-950 to-gray-900"></canvas>

        <!-- Webcam PIP (Picture-in-Picture) -->
        <div id="webcamContainer" class="absolute bottom-4 right-4 w-32 h-24 sm:w-40 sm:h-32 bg-black border-2 border-gray-700 rounded-lg overflow-hidden shadow-lg hidden z-20"></div>

        <!-- Top UI Dashboard Layer -->
        <div class="absolute top-3 left-4 right-4 flex justify-between items-center pointer-events-none">
            <!-- Score & Combo -->
            <div class="flex flex-col gap-1">
                <div class="bg-gray-900/80 backdrop-blur border border-gray-700/60 rounded-xl px-3 py-1 sm:px-4 sm:py-2 text-xs sm:text-sm font-bold shadow-lg">
                    <span class="text-gray-400">SCORE:</span> 
                    <span id="scoreText" class="text-amber-400 font-orbitron text-base sm:text-xl ml-1">0</span>
                </div>
                <div class="bg-gray-900/80 backdrop-blur border border-gray-700/60 rounded-xl px-3 py-1 text-xs font-bold shadow-lg">
                    <span class="text-gray-400">COMBO:</span> 
                    <span id="comboText" class="text-emerald-400 font-orbitron text-sm sm:text-base ml-1">0</span>
                </div>
            </div>

            <!-- Level & High Score -->
            <div class="flex flex-col items-end gap-1">
                <div class="bg-gray-900/80 backdrop-blur border border-gray-700/60 rounded-xl px-3 py-1 sm:px-4 sm:py-2 text-xs sm:text-sm font-bold shadow-lg">
                    <span class="text-gray-400">LEVEL:</span> 
                    <span id="levelText" class="text-cyan-400 font-orbitron text-base sm:text-xl ml-1">1</span>
                </div>
                <div class="bg-gray-900/80 backdrop-blur border border-gray-700/60 rounded-xl px-3 py-1 text-xs font-bold shadow-lg">
                    <span class="text-gray-400">HIGH:</span> 
                    <span id="highScoreText" class="text-purple-400 font-orbitron text-sm sm:text-base ml-1">0</span>
                </div>
            </div>
        </div>

        <!-- Center Notification Toast -->
        <div id="toastMessage" class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none transition-all duration-300 opacity-0 transform scale-75 bg-amber-400/90 text-gray-950 font-black px-6 py-2 rounded-full shadow-[0_0_20px_rgba(251,191,36,0.6)] text-center text-sm sm:text-lg z-30">
            LEVEL UP!
        </div>

        <!-- Start / Game Over Overlay Screen -->
        <div id="overlayScreen" class="absolute inset-0 bg-gray-950/90 backdrop-blur-md flex flex-col justify-center items-center p-6 text-center z-40 transition-opacity duration-300">
            <div class="text-5xl mb-2 animate-bounce">🦟 🪳</div>
            <h2 id="overlayTitle" class="text-2xl sm:text-3xl font-black text-white mb-2 font-orbitron">
                RHYTHM BUG SMASHER
            </h2>
            <p id="overlayDesc" class="text-xs sm:text-sm text-gray-300 max-w-sm leading-relaxed mb-4">
                리듬에 맞춰 타겟 영역에 들어오는 벌레를 퇴치하세요!<br>
                <span class="text-amber-400 font-bold">파리(🦟)</span> = 👏 박수 [A / 1번버튼]<br>
                <span class="text-red-400 font-bold">바퀴벌레(🪳)</span> = 👊 주먹 [S / 2번버튼]
            </p>
            
            <!-- TM Model URL Input -->
            <div class="mb-4 w-full max-w-sm text-left">
                <label class="block text-gray-400 text-xs font-bold mb-2">Teachable Machine 모델 URL (선택사항)</label>
                <input id="modelUrlInput" type="text" placeholder="https://teachablemachine.withgoogle.com/models/..." class="shadow appearance-none border border-gray-700 rounded w-full py-2 px-3 bg-gray-800 text-white leading-tight focus:outline-none focus:ring-2 focus:ring-amber-500">
                <p id="loadingStatus" class="text-xs text-amber-400 mt-2 hidden">모델 및 카메라 로딩 중... 잠시만 기다려주세요.</p>
            </div>

            <button id="startBtn" onclick="initGameWithModel()" class="px-8 py-3 bg-gradient-to-r from-red-500 to-amber-500 hover:from-red-600 hover:to-amber-600 active:scale-95 text-white font-extrabold text-lg rounded-full shadow-[0_0_25px_rgba(239,68,68,0.5)] transition-all cursor-pointer">
                게임 시작 (START)
            </button>
        </div>

        <!-- Easter Egg Jumpscare Overlay -->
        <div id="ghostScreen" class="absolute inset-0 bg-red-950 flex flex-col justify-center items-center z-50 hidden">
            <div class="ghost-face jumpscare-anim text-9xl">😱</div>
            <p class="text-red-500 font-black text-xl mt-4 font-orbitron tracking-widest">BUG OVERLOAD!</p>
        </div>
    </div>

    <!-- On-Screen Controller Buttons (Mobile / Mouse Clickable) -->
    <div class="mt-4 sm:mt-6 w-full max-w-[640px] grid grid-cols-2 gap-3 sm:gap-4 px-2">
        <button id="clapBtn" onclick="triggerGesture('clap')" class="flex flex-col items-center justify-center p-3 sm:p-4 bg-gradient-to-br from-amber-600 to-yellow-600 hover:from-amber-500 hover:to-yellow-500 active:scale-95 border-2 border-yellow-300/40 rounded-2xl shadow-lg transition-all cursor-pointer group">
            <span class="text-2xl sm:text-4xl group-active:scale-125 transition-transform">👏</span>
            <span id="btnLabelFly" class="text-xs sm:text-sm font-black mt-1 text-yellow-100">박수 / CLAP</span>
            <span class="text-[10px] text-yellow-200/70">[단축키: A]</span>
        </button>

        <button id="punchBtn" onclick="triggerGesture('punch')" class="flex flex-col items-center justify-center p-3 sm:p-4 bg-gradient-to-br from-red-700 to-rose-700 hover:from-red-600 hover:to-rose-600 active:scale-95 border-2 border-red-300/40 rounded-2xl shadow-lg transition-all cursor-pointer group">
            <span class="text-2xl sm:text-4xl group-active:scale-125 transition-transform">👊</span>
            <span id="btnLabelRoach" class="text-xs sm:text-sm font-black mt-1 text-red-100">주먹 / PUNCH</span>
            <span class="text-[10px] text-red-200/70">[단축키: S]</span>
        </button>
    </div>

    <!-- Audio Synth & Game Script -->
    <script>
        // --- Web Audio API Synth Engine ---
        class SoundEngine {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playHit() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }

            playMiss() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(60, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }

            playLevelUp() {
                if (!this.ctx) return;
                const notes = [261.63, 329.63, 392.00, 523.25];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);
                    gain.gain.setValueAtTime(0.25, this.ctx.currentTime + idx * 0.08);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.08 + 0.2);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + idx * 0.08);
                    osc.stop(this.ctx.currentTime + idx * 0.08 + 0.2);
                });
            }
        }

        const sound = new SoundEngine();

        // --- Game Setup & State Variables ---
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Internal resolution fixing
        const CANVAS_WIDTH = 640;
        const CANVAS_HEIGHT = 480;
        canvas.width = CANVAS_WIDTH;
        canvas.height = CANVAS_HEIGHT;

        const TARGET_CENTER = { x: CANVAS_WIDTH / 2, y: CANVAS_HEIGHT / 2 };
        const TARGET_RADIUS = 55;

        let isGameRunning = false;
        let score = 0;
        let combo = 0;
        let level = 1;
        let highScore = 0;
        let bugs = [];
        let particles = [];
        let floatingTexts = [];
        let spawnTimer = null;
        let activeGestureEffect = null;

        // TM Pose Variables
        let tmModel, tmWebcam, tmMaxPredictions;
        let lastGestureTime = 0;
        let classFly = "박수"; // 자동 로드될 1번 클래스
        let classRoach = "주먹"; // 자동 로드될 2번 클래스

        // Gesture activation visual timeout
        let gestureTimer = null;

        // --- Event Listeners ---
        window.addEventListener('keydown', (e) => {
            if (e.key === 'a' || e.key === 'A' || e.key === 'ㅁ') {
                triggerGesture('clap');
            } else if (e.key === 's' || e.key === 'S' || e.key === 'ㄴ') {
                triggerGesture('punch');
            }
        });

        // Click target directly on canvas as fallback gesture trigger
        canvas.addEventListener('click', (e) => {
            if (!isGameRunning) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = CANVAS_WIDTH / rect.width;
            const scaleY = CANVAS_HEIGHT / rect.height;
            const clickX = (e.clientX - rect.left) * scaleX;
            const clickY = (e.clientY - rect.top) * scaleY;

            // Check if closest bug is fly or roach
            let closestBug = null;
            let minDist = Infinity;
            bugs.forEach(bug => {
                const d = Math.hypot(bug.x - TARGET_CENTER.x, bug.y - TARGET_CENTER.y);
                if (d < minDist) {
                    minDist = d;
                    closestBug = bug;
                }
            });

            if (closestBug && minDist < TARGET_RADIUS + 30) {
                triggerGesture(closestBug.type === 'fly' ? 'clap' : 'punch');
            }
        });

        // --- Model Init & Start Game ---
        async function initGameWithModel() {
            const urlInput = document.getElementById("modelUrlInput").value.trim();
            const startBtn = document.getElementById("startBtn");
            const loadingStatus = document.getElementById("loadingStatus");
            
            startBtn.disabled = true;
            loadingStatus.classList.remove("hidden");
            loadingStatus.innerText = "카메라 및 모델 로딩 중... 잠시만 기다려주세요.";

            try {
                // 1. 모델 로드 (URL이 입력된 경우)
                if (urlInput) {
                    const modelURL = urlInput + (urlInput.endsWith("/") ? "" : "/") + "model.json";
                    const metadataURL = urlInput + (urlInput.endsWith("/") ? "" : "/") + "metadata.json";
                    tmModel = await tmPose.load(modelURL, metadataURL);
                    tmMaxPredictions = tmModel.getTotalClasses();

                    // 모델에서 클래스(동작) 이름을 자동으로 가져와서 할당
                    const classLabels = tmModel.getClassLabels();
                    if (classLabels.length >= 1) classFly = classLabels[0];
                    if (classLabels.length >= 2) classRoach = classLabels[1];

                    // 하단 버튼 텍스트를 불러온 동작 이름으로 변경
                    document.getElementById("btnLabelFly").innerText = classFly;
                    document.getElementById("btnLabelRoach").innerText = classRoach;
                }

                // 2. 웹캠 셋업
                const flip = true; 
                tmWebcam = new tmPose.Webcam(200, 150, flip);
                await tmWebcam.setup(); 
                await tmWebcam.play();
                
                const wcContainer = document.getElementById("webcamContainer");
                wcContainer.innerHTML = '';
                tmWebcam.canvas.style.width = '100%';
                tmWebcam.canvas.style.height = '100%';
                tmWebcam.canvas.style.objectFit = 'cover';
                wcContainer.appendChild(tmWebcam.canvas);
                wcContainer.classList.remove("hidden");
                
                // 3. 루프 시작
                if (tmModel) {
                    window.requestAnimationFrame(predictLoop);
                    setTimeout(() => showToast(`🦟 ${classFly} / 🪳 ${classRoach}`), 1000);
                } else {
                    window.requestAnimationFrame(renderWebcamLoop);
                }

            } catch (err) {
                console.error("Model/Webcam loading failed:", err);
                loadingStatus.innerText = "로딩 실패! 카메라 권한을 확인해주세요. (키보드 모드로 시작합니다)";
                setTimeout(() => startGame(), 2000);
                return;
            }

            loadingStatus.classList.add("hidden");
            startBtn.disabled = false;
            startGame();
        }

        async function predictLoop() {
            if (!isGameRunning) return;
            tmWebcam.update();
            const { pose, posenetOutput } = await tmModel.estimatePose(tmWebcam.canvas);
            const prediction = await tmModel.predict(posenetOutput);

            let bestClass = "";
            let highestProb = 0;
            
            for (let i = 0; i < tmMaxPredictions; i++) {
                if (prediction[i].probability > highestProb) {
                    highestProb = prediction[i].probability;
                    bestClass = prediction[i].className;
                }
            }

            const now = Date.now();
            // 60% 이상 확신 & 500ms 쿨타임 (인식률 임계값을 85% -> 60%로 완화하여 쉽게 인식되도록 수정)
            if (highestProb > 0.60 && (now - lastGestureTime > 500)) {
                if (bestClass === classFly) {
                    triggerGesture('clap');
                    lastGestureTime = now;
                } else if (bestClass === classRoach) {
                    triggerGesture('punch');
                    lastGestureTime = now;
                }
            }
            window.requestAnimationFrame(predictLoop);
        }

        async function renderWebcamLoop() {
            if (!isGameRunning) return;
            tmWebcam.update();
            window.requestAnimationFrame(renderWebcamLoop);
        }

        function startGame() {
            sound.init();
            document.getElementById("overlayScreen").classList.add("opacity-0", "pointer-events-none");
            
            score = 0;
            combo = 0;
            level = 1;
            bugs = [];
            particles = [];
            floatingTexts = [];
            isGameRunning = true;
            
            updateUI();
            scheduleNextBug();
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            isGameRunning = false;
            clearTimeout(spawnTimer);

            if (tmWebcam) {
                tmWebcam.pause();
                document.getElementById("webcamContainer").classList.add("hidden");
            }

            if (score > highScore) {
                highScore = score;
                document.getElementById("highScoreText").innerText = highScore;
            }

            document.getElementById("overlayTitle").innerText = "GAME OVER";
            document.getElementById("overlayDesc").innerHTML = `최종 점수: <b class="text-amber-400 font-orbitron">${score}</b> 점<br>최대 레벨: <b class="text-cyan-400 font-orbitron">LV.${level}</b>`;
            document.getElementById("startBtn").innerText = "다시 도전하기";
            document.getElementById("overlayScreen").classList.remove("opacity-0", "pointer-events-none");
        }

        function updateUI() {
            document.getElementById("scoreText").innerText = score;
            document.getElementById("comboText").innerText = combo;
            document.getElementById("levelText").innerText = level;
        }

        function showToast(msg) {
            const toast = document.getElementById("toastMessage");
            toast.innerText = msg;
            toast.classList.remove("opacity-0", "scale-75");
            toast.classList.add("opacity-100", "scale-100");
            setTimeout(() => {
                toast.classList.remove("opacity-100", "scale-100");
                toast.classList.add("opacity-0", "scale-75");
            }, 1200);
        }

        // --- Bug Spawning Logic ---
        function scheduleNextBug() {
            if (!isGameRunning) return;

            // Interval scales down with level
            const baseInterval = Math.max(500, 2000 - (level * 180));
            
            spawnTimer = setTimeout(() => {
                spawnBug();
                scheduleNextBug();
            }, baseInterval);
        }

        function spawnBug() {
            const type = Math.random() < 0.5 ? 'fly' : 'roach';
            const side = Math.floor(Math.random() * 4);
            let startX, startY;

            switch(side) {
                case 0: startX = Math.random() * CANVAS_WIDTH; startY = -40; break;
                case 1: startX = CANVAS_WIDTH + 40; startY = Math.random() * CANVAS_HEIGHT; break;
                case 2: startX = Math.random() * CANVAS_WIDTH; startY = CANVAS_HEIGHT + 40; break;
                case 3: startX = -40; startY = Math.random() * CANVAS_HEIGHT; break;
            }

            // Speed increases with level
            const speed = 1.8 + (level * 0.45);

            bugs.push({
                x: startX,
                y: startY,
                type: type, // 'fly' or 'roach'
                speed: speed,
                angle: Math.atan2(TARGET_CENTER.y - startY, TARGET_CENTER.x - startX),
                scale: 1
            });

            // 0.2% Chance Easter Egg
            if (Math.random() < 0.002) {
                triggerGhostEasterEgg();
            }
        }

        function triggerGhostEasterEgg() {
            const ghostScreen = document.getElementById("ghostScreen");
            ghostScreen.classList.remove("hidden");
            setTimeout(() => {
                ghostScreen.classList.add("hidden");
            }, 300);
        }

        // --- Gesture Trigger Handler ---
        function triggerGesture(gestureType) {
            if (!isGameRunning) return;

            activeGestureEffect = { type: gestureType, opacity: 1 };
            
            // Highlight visual buttons briefly
            const btnId = gestureType === 'clap' ? 'clapBtn' : 'punchBtn';
            const btnEl = document.getElementById(btnId);
            btnEl.classList.add('scale-95', 'brightness-125');
            setTimeout(() => btnEl.classList.remove('scale-95', 'brightness-125'), 150);

            // Check collision with bugs near central target zone
            let hitFound = false;

            for (let i = bugs.length - 1; i >= 0; i--) {
                const bug = bugs[i];
                const dist = Math.hypot(bug.x - TARGET_CENTER.x, bug.y - TARGET_CENTER.y);

                // Hit detection radius window
                if (dist <= TARGET_RADIUS + 25) {
                    const isCorrectAction = (bug.type === 'fly' && gestureType === 'clap') || 
                                           (bug.type === 'roach' && gestureType === 'punch');

                    if (isCorrectAction) {
                        hitFound = true;
                        createParticles(bug.x, bug.y, bug.type === 'fly' ? '#f59e0b' : '#ef4444');
                        
                        // Score calculation
                        combo++;
                        const points = 10 + Math.floor(combo / 3) * 5;
                        score += points;

                        createFloatingText(`+${points}`, bug.x, bug.y, '#f59e0b');
                        createFloatingText(combo > 2 ? `${combo} COMBO!` : 'PERFECT!', TARGET_CENTER.x, TARGET_CENTER.y - 60, '#34d399');

                        sound.playHit();
                        bugs.splice(i, 1);

                        // Level up threshold
                        if (score >= level * 100) {
                            level++;
                            sound.playLevelUp();
                            showToast(`LEVEL UP! LV.${level}`);
                        }

                        updateUI();
                        break;
                    }
                }
            }

            if (!hitFound) {
                // Check if player clicked when no bug was in target zone
                combo = 0;
                updateUI();
                sound.playMiss();
                createFloatingText('MISS!', TARGET_CENTER.x, TARGET_CENTER.y - 60, '#ef4444');
            }
        }

        // --- Visual Effects Generators ---
        function createParticles(x, y, color) {
            for (let i = 0; i < 16; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    radius: Math.random() * 4 + 2,
                    color: color,
                    alpha: 1
                });
            }
        }

        function createFloatingText(text, x, y, color) {
            floatingTexts.push({
                text: text,
                x: x,
                y: y,
                color: color,
                alpha: 1,
                scale: 1.2
            });
        }

        // --- Main Render Loop ---
        function gameLoop() {
            if (!isGameRunning) return;

            // Clear screen
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // Draw Target Zone Crosshair
            drawTargetArea();

            // Update & Render Bugs
            for (let i = bugs.length - 1; i >= 0; i--) {
                const bug = bugs[i];

                // Move towards center
                bug.x += Math.cos(bug.angle) * bug.speed;
                bug.y += Math.sin(bug.angle) * bug.speed;

                const distToCenter = Math.hypot(bug.x - TARGET_CENTER.x, bug.y - TARGET_CENTER.y);

                // Render bug emoji & rotation angle
                ctx.save();
                ctx.translate(bug.x, bug.y);
                ctx.rotate(bug.angle + Math.PI / 2);
                ctx.font = "34px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(bug.type === 'fly' ? '🦟' : '🪳', 0, 0);
                ctx.restore();

                // If bug reaches center without being hit -> Missed / Game Over condition check
                if (distToCenter < 15) {
                    bugs.splice(i, 1);
                    combo = 0;
                    updateUI();
                    sound.playMiss();
                    createFloatingText('OOPS!', TARGET_CENTER.x, TARGET_CENTER.y, '#ef4444');
                }
            }

            // Update & Render Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }

            // Update & Render Floating Texts
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                ft.y -= 1.2;
                ft.alpha -= 0.02;
                if (ft.alpha <= 0) {
                    floatingTexts.splice(i, 1);
                    continue;
                }
                ctx.save();
                ctx.globalAlpha = ft.alpha;
                ctx.font = "900 22px Orbitron, sans-serif";
                ctx.fillStyle = ft.color;
                ctx.textAlign = "center";
                ctx.shadowColor = "rgba(0,0,0,0.8)";
                ctx.shadowBlur = 6;
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            }

            // Render Gesture Feedback Burst
            if (activeGestureEffect) {
                ctx.save();
                ctx.globalAlpha = activeGestureEffect.opacity;
                ctx.font = "60px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                const icon = activeGestureEffect.type === 'clap' ? '👏' : '👊';
                ctx.fillText(icon, TARGET_CENTER.x, TARGET_CENTER.y);
                ctx.restore();

                activeGestureEffect.opacity -= 0.08;
                if (activeGestureEffect.opacity <= 0) {
                    activeGestureEffect = null;
                }
            }

            requestAnimationFrame(gameLoop);
        }

        // Draw Central Target Reticle
        function drawTargetArea() {
            // Target Outer Ring
            ctx.beginPath();
            ctx.arc(TARGET_CENTER.x, TARGET_CENTER.y, TARGET_RADIUS, 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(52, 211, 153, 0.5)";
            ctx.lineWidth = 4;
            ctx.stroke();

            // Target Inner Ring
            ctx.beginPath();
            ctx.arc(TARGET_CENTER.x, TARGET_CENTER.y, TARGET_RADIUS - 12, 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(52, 211, 153, 0.25)";
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 6]);
            ctx.stroke();
            ctx.setLineDash([]);

            // Crosshair Lines
            ctx.beginPath();
            ctx.moveTo(TARGET_CENTER.x - TARGET_RADIUS - 10, TARGET_CENTER.y);
            ctx.lineTo(TARGET_CENTER.x + TARGET_RADIUS + 10, TARGET_CENTER.y);
            ctx.moveTo(TARGET_CENTER.x, TARGET_CENTER.y - TARGET_RADIUS - 10);
            ctx.lineTo(TARGET_CENTER.x, TARGET_CENTER.y + TARGET_RADIUS + 10);
            ctx.strokeStyle = "rgba(52, 211, 153, 0.4)";
            ctx.lineWidth = 2;
            ctx.stroke();
        }
    </script>
